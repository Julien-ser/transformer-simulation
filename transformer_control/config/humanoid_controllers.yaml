# Humanoid Mode Controllers
# All joints use position interface for precise control

# Joint State Broadcaster (always active)
joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

# Main trajectory controller for humanoid movement
humanoid_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - torso_yaw
      - torso_pitch
      - torso_roll
      - head_pan
      - head_tilt
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_elbow
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_elbow
      - left_hip_yaw
      - left_hip_pitch
      - left_knee
      - right_hip_yaw
      - right_hip_pitch
      - right_knee
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    state_dependent_rate_reduction:
      step_rate_factor: 0.5
    # Default gains for position control
    g:
      torso_yaw: {p: 100.0, i: 0.0, d: 10.0}
      torso_pitch: {p: 100.0, i: 0.0, d: 10.0}
      torso_roll: {p: 100.0, i: 0.0, d: 10.0}
      head_pan: {p: 80.0, i: 0.0, d: 5.0}
      head_tilt: {p: 80.0, i: 0.0, d: 5.0}
      left_shoulder_pitch: {p: 80.0, i: 0.0, d: 5.0}
      left_shoulder_roll: {p: 80.0, i: 0.0, d: 5.0}
      left_elbow: {p: 50.0, i: 0.0, d: 3.0}
      right_shoulder_pitch: {p: 80.0, i: 0.0, d: 5.0}
      right_shoulder_roll: {p: 80.0, i: 0.0, d: 5.0}
      right_elbow: {p: 50.0, i: 0.0, d: 3.0}
      left_hip_yaw: {p: 120.0, i: 0.0, d: 15.0}
      left_hip_pitch: {p: 120.0, i: 0.0, d: 15.0}
      left_knee: {p: 120.0, i: 0.0, d: 15.0}
      right_hip_yaw: {p: 120.0, i: 0.0, d: 15.0}
      right_hip_pitch: {p: 120.0, i: 0.0, d: 15.0}
      right_knee: {p: 120.0, i: 0.0, d: 15.0}
