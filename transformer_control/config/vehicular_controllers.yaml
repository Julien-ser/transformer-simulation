# Vehicular Mode Controllers
# Wheels use velocity interface, arms/head use position interface

# Joint State Broadcaster
joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

# Wheel velocity controller for driving
wheel_velocity_controller:
  ros__parameters:
    type: velocity_controllers/JointGroupVelocityController
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
    state_publish_rate: 50.0
    # Default velocities (rad/s)
    constraints:
      front_left_wheel_joint: {velocity: 10.0}
      front_right_wheel_joint: {velocity: 10.0}
      rear_left_wheel_joint: {velocity: 10.0}
      rear_right_wheel_joint: {velocity: 10.0}

# Position controller for head and arms (tucked position control)
arm_head_position_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - head_pan
      - head_tilt
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_elbow
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_elbow
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    state_dependent_rate_reduction:
      step_rate_factor: 0.5
    # Default gains for position control
    g:
      head_pan: {p: 80.0, i: 0.0, d: 5.0}
      head_tilt: {p: 80.0, i: 0.0, d: 5.0}
      left_shoulder_pitch: {p: 80.0, i: 0.0, d: 5.0}
      left_shoulder_roll: {p: 80.0, i: 0.0, d: 5.0}
      left_elbow: {p: 50.0, i: 0.0, d: 3.0}
      right_shoulder_pitch: {p: 80.0, i: 0.0, d: 5.0}
      right_shoulder_roll: {p: 80.0, i: 0.0, d: 5.0}
      right_elbow: {p: 50.0, i: 0.0, d: 3.0}
